services:
  mongo:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: kindergarten
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2-20
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "8081:8081"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  object-storage:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"
      - "9001:9001"
      - 5004:5004
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  studentservice:
    build: ./studentservice
    ports:
      - "5001:5001"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/kindergarten?authSource=admin
      DATABASE_NAME: kindergarten


  teacherservice:
    build: ./teacherservice
    ports:
      - "5002:5002"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/kindergarten?authSource=admin
      DATABASE_NAME: kindergarten


  employeeservice:
    build: ./employeeservice
    ports:
      - "5003:5003"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/kindergarten?authSource=admin
      DATABASE_NAME: kindergarten


  profileservice:
    build: ./profileservice
    network_mode: "service:object-storage"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/kindergarten?authSource=admin
      DATABASE_NAME: kindergarten
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      S3_BUCKET: school-media
      S3_THUMBNAIL_BUCKET: school-thumbnails
      FRONTEND_ORIGIN: http://localhost:3000


  thumbnailworker:
    build: ./thumbnailworker
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/kindergarten?authSource=admin
      DATABASE_NAME: kindergarten
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://object-storage:9000
      S3_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      S3_BUCKET: school-media
      S3_THUMBNAIL_BUCKET: school-thumbnails


  frontend:
    build: ./frontend
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - studentservice
      - teacherservice
      - employeeservice
      - profileservice
    restart: unless-stopped

volumes:
  mongo-data:
  object-storage-data:
  rabbitmq-data:

server {
    listen 80;

    location / {
        proxy_pass http://frontend:80;
    }

    location /api/students/ {
        proxy_pass http://studentservice:5001/;
    }

    location /api/teachers/ {
        proxy_pass http://teacherservice:5002/;
    }

    location /api/employees/ {
        proxy_pass http://employeeservice:5003/;
    }

    location /api/profile/ {
        proxy_pass http://object-storage:5004/;
    }
}
